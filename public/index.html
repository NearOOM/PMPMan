<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PMPMan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
>

<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/bundles/bundle.css">

</head><body><main class="container app-shell">

    <header class="app-header">
        <div>
            <h1 class="app-title">PMPMan</h1>
            <p class="app-subtitle">Pumpkin Minecraft Server Manager</p>
        </div>

        <span id="status" class="status-pill status-offline">
            <span class="status-dot"></span>
            Offline
        </span>
    </header>


    <section class="resource-stats" id="resourceStats">

        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">Server CPU</span>
                <span class="stat-value" id="cpuValue">—</span>
            </div>

            <div class="stat-bar">
                <div class="stat-bar-fill" id="cpuBar"></div>
            </div>
        </div>


        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">System memory</span>
                <span class="stat-value" id="memValue">—</span>
            </div>

            <div class="stat-bar">
                <div class="stat-bar-fill" id="memBar"></div>
            </div>
        </div>


        <div class="stat-block">
            <div class="stat-row">
                <span class="stat-label">Pumpkin memory</span>
                <span class="stat-value" id="pumpkinMemValue">—</span>
            </div>

            <div class="stat-bar">
                <div class="stat-bar-fill" id="pumpkinMemBar"></div>
            </div>
        </div>

    </section>


    <section class="console-card">

        <div class="console-toolbar">
            <span class="console-label">Console</span>

            <span
                id="connLabel"
                class="conn-label conn-disconnected"
            >
                Disconnected
            </span>
        </div>


        <div class="terminal-container">
            <div id="terminal"></div>
        </div>


        <form id="commandForm" class="prompt-row">

            <span class="prompt-glyph">$</span>

            <input
                id="commandInput"
                type="text"
                class="prompt-input"
                placeholder="Type a command and press enter..."
                autocomplete="off"
            >

            <button
                type="submit"
                class="prompt-send"
            >
                Send
            </button>

        </form>

    </section>


    <section class="power-controls">

        <button
            id="startBtn"
            class="power-btn power-start"
            type="button"
        >
            <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                fill="currentColor"
                aria-hidden="true"
            >
                <path d="M4 2.5v11l9-5.5-9-5.5z"/>
            </svg>

            Start
        </button>


        <button
            id="stopBtn"
            class="power-btn power-stop"
            type="button"
        >
            <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                fill="currentColor"
                aria-hidden="true"
            >
                <rect
                    x="4"
                    y="4"
                    width="8"
                    height="8"
                    rx="1"
                />
            </svg>

            Stop
        </button>


        <button
            id="restartBtn"
            class="power-btn power-restart"
            type="button"
        >
            <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                fill="currentColor"
                aria-hidden="true"
            >
                <path d="M13.65 2.35a7 7 0 1 0 1.6 7.4h-1.57a5.5 5.5 0 1 1-1.35-5.44L9.5 7h5V2l-1.85 1.85z"/>
            </svg>

            Restart
        </button>

    </section>

</main>


<script src="/bundles/bundle.js"></script>

</body>
</html>
